<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Змейка</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --grid: #16213a; --text: #e2e8f0;
    --muted: #94a3b8; --snake: #22c55e; --head: #4ade80; --food: #f43f5e; --btn: #334155;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; flex-direction: column; align-items: center;
    padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom)); }
  header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  h1 { font-size: 22px; margin: 0; }
  .score { font-size: 15px; color: var(--muted); text-align: right; line-height: 1.3; }
  .score b { color: var(--text); font-size: 18px; }
  .wrap { position: relative; width: 100%; max-width: 480px; }
  canvas { display: block; width: 100%; aspect-ratio: 1; background: var(--grid); border-radius: 14px; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(15,23,42,.82); border-radius: 14px; text-align: center; padding: 16px; }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 28px; }
  .overlay p { margin: 0; color: var(--muted); font-size: 15px; }
  .big { background: var(--snake); color: #052e16; border: 0; font-size: 20px; font-weight: 700;
    padding: 14px 36px; border-radius: 999px; cursor: pointer; }
  .pad { margin-top: 14px; display: grid; grid-template-columns: repeat(3, 72px); grid-template-rows: repeat(3, 72px); gap: 8px; }
  .pad button { background: var(--btn); color: var(--text); border: 0; border-radius: 16px; font-size: 28px; cursor: pointer; }
  .pad button:active { background: #475569; }
  .up { grid-column: 2; grid-row: 1; } .left { grid-column: 1; grid-row: 2; }
  .pause { grid-column: 2; grid-row: 2; font-size: 20px !important; } .right { grid-column: 3; grid-row: 2; }
  .down { grid-column: 2; grid-row: 3; }
  .hint { margin-top: 10px; font-size: 13px; color: var(--muted); text-align: center; }
  @media (min-height: 800px) { .pad { grid-template-columns: repeat(3, 84px); grid-template-rows: repeat(3, 84px); } }
</style>
</head>
<body>
<header>
  <h1>🐍 Змейка</h1>
  <div class="score">Счёт: <b id="score">0</b><br>Рекорд: <span id="best">0</span></div>
</header>
<div class="wrap">
  <canvas id="c"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="title">Змейка</h2>
    <p id="msg">Свайпай по экрану или жми на кнопки</p>
    <button class="big" id="start">Играть</button>
  </div>
</div>
<div class="pad">
  <button class="up" data-d="up" aria-label="Вверх">▲</button>
  <button class="left" data-d="left" aria-label="Влево">◀</button>
  <button class="pause" id="pauseBtn" aria-label="Пауза">❚❚</button>
  <button class="right" data-d="right" aria-label="Вправо">▶</button>
  <button class="down" data-d="down" aria-label="Вниз">▼</button>
</div>
<div class="hint">На компьютере — стрелки/WASD, пробел — пауза</div>

<script>
(() => {
  const N = 20;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const msgEl = document.getElementById('msg');
  const startBtn = document.getElementById('start');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  let best = 0;
  try { best = +localStorage.getItem('snake-best') || 0; } catch (e) {}
  bestEl.textContent = best;

  let snake, dir, queue, food, score, speed, running = false, paused = false, timer = null, cell = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const size = canvas.clientWidth;
    canvas.width = canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = size / N;
    draw();
  }

  function reset() {
    snake = [[10, 10], [9, 10], [8, 10]];
    dir = 'right'; queue = []; score = 0; speed = 140;
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    const free = [];
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++)
      if (!snake.some(s => s[0] === x && s[1] === y)) free.push([x, y]);
    food = free[Math.floor(Math.random() * free.length)];
  }

  function turn(d) {
    if (!running || paused) return;
    const last = queue.length ? queue[queue.length - 1] : dir;
    const [lx, ly] = DIRS[last], [dx, dy] = DIRS[d];
    if (lx + dx === 0 && ly + dy === 0) return; // no reversing
    if (d === last) return;
    if (queue.length < 3) queue.push(d);
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const [dx, dy] = DIRS[dir];
    const head = [(snake[0][0] + dx + N) % N, (snake[0][1] + dy + N) % N];
    const eating = head[0] === food[0] && head[1] === food[1];
    const body = eating ? snake : snake.slice(0, -1);
    if (body.some(s => s[0] === head[0] && s[1] === head[1])) return gameOver();
    snake.unshift(head);
    if (eating) {
      score++; scoreEl.textContent = score;
      if (navigator.vibrate) navigator.vibrate(15);
      speed = Math.max(60, 140 - score * 3);
      placeFood();
    } else snake.pop();
    draw();
    timer = setTimeout(step, speed);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.fill();
  }

  function draw() {
    if (!snake) return;
    const size = cell * N;
    ctx.clearRect(0, 0, size, size);
    ctx.fillStyle = '#1a2744';
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++)
      if ((x + y) % 2) ctx.fillRect(x * cell, y * cell, cell, cell);
    ctx.fillStyle = '#f43f5e';
    ctx.beginPath();
    ctx.arc(food[0] * cell + cell / 2, food[1] * cell + cell / 2, cell * 0.38, 0, Math.PI * 2);
    ctx.fill();
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
      const p = cell * 0.08;
      roundRect(s[0] * cell + p, s[1] * cell + p, cell - 2 * p, cell - 2 * p, cell * 0.25);
    });
    // eyes
    const [hx, hy] = snake[0], [dx, dy] = DIRS[dir];
    ctx.fillStyle = '#052e16';
    const cx = hx * cell + cell / 2 + dx * cell * 0.15, cy = hy * cell + cell / 2 + dy * cell * 0.15;
    const ox = dy * cell * 0.18, oy = dx * cell * 0.18;
    ctx.beginPath(); ctx.arc(cx + ox, cy + oy, cell * 0.08, 0, 7); ctx.arc(cx - ox, cy - oy, cell * 0.08, 0, 7); ctx.fill();
  }

  function start() {
    reset(); running = true; paused = false;
    overlay.classList.add('hidden');
    draw();
    clearTimeout(timer); timer = setTimeout(step, speed);
  }

  function gameOver() {
    running = false; clearTimeout(timer);
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
    if (score > best) {
      best = score; bestEl.textContent = best;
      try { localStorage.setItem('snake-best', best); } catch (e) {}
    }
    titleEl.textContent = 'Игра окончена';
    msgEl.textContent = 'Счёт: ' + score + ' · Рекорд: ' + best;
    startBtn.textContent = 'Ещё раз';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      clearTimeout(timer);
      titleEl.textContent = 'Пауза'; msgEl.textContent = 'Счёт: ' + score; startBtn.textContent = 'Продолжить';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
      timer = setTimeout(step, speed);
    }
  }

  startBtn.addEventListener('click', () => (running && paused) ? togglePause() : start());
  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  document.querySelectorAll('.pad [data-d]').forEach(b =>
    b.addEventListener('pointerdown', e => { e.preventDefault(); turn(b.dataset.d); }));

  const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right', 'ц': 'up', 'ы': 'down', 'ф': 'left', 'в': 'right' };
  document.addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); running ? togglePause() : start(); return; }
    const d = KEYS[e.key] || KEYS[e.key.toLowerCase()];
    if (d) { e.preventDefault(); turn(d); }
  });

  let sx = 0, sy = 0, swiping = false;
  document.addEventListener('touchstart', e => {
    if (e.target.closest('button')) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiping = true;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!swiping) return;
    const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', () => { swiping = false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && running && !paused) togglePause(); });

  window.addEventListener('resize', resize);
  reset(); resize();
})();
</script>
</body>
</html>
